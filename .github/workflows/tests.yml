name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the secfsdstools stack pins numpy<2
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e ".[dev]"
      # pure logic: no network, no SEC data
      - run: pytest -q
      - run: for f in deploy/*.sh; do bash -n "$f"; done
